name: Promote current screenshots to baseline

on:
  workflow_dispatch:
    inputs:
      screenshots:
        description: "Optional: comma-separated screenshot base names (example: login_page,header_icon). Leave empty to promote ALL."
        required: false
        type: string

jobs:
  promote-baseline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Promote current screenshots to baseline
        run: |
          set -e

          INPUT="${{ inputs.screenshots }}"

          if [ -z "$INPUT" ]; then
            echo "🚀 No input provided. Promoting ALL current screenshots."

            find . -name "*_current.png" | while read current; do
              baseline="${current/_current.png/_baseline.png}"
              echo "✅ Promoting $current → $baseline"
              cp "$current" "$baseline"
            done

          else
            echo "🎯 Promoting selected screenshots: $INPUT"

            IFS=',' read -ra SHOTS <<< "$INPUT"

            for shot in "${SHOTS[@]}"; do
              shot=$(echo "$shot" | xargs)

              current=$(find . -name "${shot}_current.png")

              if [ -z "$current" ]; then
                echo "❌ Current screenshot not found for: $shot"
                exit 1
              fi

              baseline="${current/_current.png/_baseline.png}"
              echo "✅ Promoting $current → $baseline"
              cp "$current" "$baseline"
            done
          fi

      - name: Commit baseline updates
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .
          git commit -m "Promote current screenshots to baseline" || echo "No changes to commit"
          git push
